# Deploy the static site to GitHub Pages using GitHub Actions.
# Set Pages source to "GitHub Actions" in Settings > Pages (not "Deploy from a branch").
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # allows manual runs from the Actions tab

# Permissions the deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; do not cancel an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'          # repo root; index.html and audit.html live here

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
